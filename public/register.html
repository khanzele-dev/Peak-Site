<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Регистрация — PEAK</title>
<meta name="description" content="Регистрация в PEAK — премиальном VPN.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-dark-32x32.png">
<link rel="apple-touch-icon" href="/apple-icon.png">
</head>
<body>

<div class="bg-topo" aria-hidden="true"></div>
<svg class="auth-ridge" viewBox="0 0 1440 360" preserveAspectRatio="xMidYMax slice" fill="none" aria-hidden="true">
  <path d="M0 360 260 190l110 80 240-230 150 140 110-70 300 250" stroke="#D6A33A" stroke-opacity=".22" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M-40 360 300 240l90 50 250-160 150 110 130-60 360 180" stroke="#ffffff" stroke-opacity=".06" stroke-linejoin="round"/>
</svg>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="/index.html" class="logo" aria-label="PEAK VPN — на главную">
      <span class="logo-text">PEAK <span>VPN</span></span>
    </a>
    <div class="nav-actions">
      <a href="/index.html" class="nav-link">На главную</a>
      <a href="/login.html" class="nav-buy">Войти</a>
    </div>
    <button class="nav-burger" id="nav-burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav-mobile-menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile-menu" id="nav-mobile-menu">
    <a href="/index.html" class="nav-mobile-link">На главную</a>
    <a href="/login.html" class="nav-mobile-buy">Войти</a>
    <div class="nav-mobile-divider"></div>
    <a href="https://t.me/PeakPNBot" class="nav-mobile-link">Политика конфиденциальности</a>
    <a href="https://t.me/PeakPNBot" class="nav-mobile-link">Условия использования</a>
    <a href="https://t.me/PeakVPNSupport" class="nav-mobile-link">Поддержка</a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="/index.html" class="auth-logo" aria-label="PEAK — на главную">
        <img src="/img/peak-mark.png" alt="" class="logo-mark" width="40" height="40" decoding="async">
        <span class="logo-text">PEAK</span>
      </a>
      <h1 class="auth-title">Регистрация</h1>
      <p class="auth-sub">Укажите номер телефона и пароль для доступа к кабинету.</p>

      <div class="auth-alert" id="form-alert" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="phone">Телефон</label>
          <input class="input" type="tel" id="phone" name="phone" placeholder="+7 900 123-45-67" autocomplete="tel" inputmode="tel" required>
          <p class="field-error" data-error-for="phone"></p>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input class="input" type="password" id="password" name="password" placeholder="Минимум 8 символов" autocomplete="new-password" required>
          <p class="field-error" data-error-for="password"></p>
        </div>

        <div class="field">
          <label for="confirm">Повторите пароль</label>
          <input class="input" type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" required>
          <p class="field-error" data-error-for="confirm"></p>
        </div>

        <button type="submit" class="btn-primary btn-block" id="submit-btn">
          <span class="btn-label">Зарегистрироваться</span>
        </button>
      </form>

      <p class="auth-foot">Уже есть аккаунт? <a href="/login.html">Войдите в него</a>.</p>
    </div>
    <p class="auth-slogan">Быстрее, даже в горах</p>
  </div>
</main>

<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
